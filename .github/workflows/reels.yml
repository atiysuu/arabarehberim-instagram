name: Instagram'a Reels paylas

on:
  # Gunde bir Reels: 15:07 UTC = 18:07 TR. Postlar (09:37, 13:37, 20:37)
  # ayri is akisinda; ikisi birbirini beklemez.
  # Durdurmak icin: Actions > "Instagram'a Reels paylas" > ... > Disable workflow.
  schedule:
    - cron: "7 15 * * *"
  workflow_dispatch:
    inputs:
      adet:
        description: "Kac Reels atilsin"
        default: "1"
      kuru:
        description: "Kuru calistirma: Instagram'a atma, sadece kontrol et"
        type: boolean
        default: false

concurrency:
  group: instagram-reels
  cancel-in-progress: false

permissions:
  contents: write   # reels-barinak release'i + durum/reels.jsonl commit'i

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Videolar indirilmez; betik o gun gereken tek videoyu git'ten ceker.
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/posts/
            !/reels/**/*.mp4
            !/reels/**/*.jpg

      - name: Siradaki Reels'i paylas
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/reels_paylas.py --adet "${{ inputs.adet || '1' }}" ${{ inputs.kuru && '--kuru' || '' }}

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name  "arabarehberim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add durum/
          if git diff --staged --quiet; then
            echo "durumda degisiklik yok"
            exit 0
          fi
          git commit -q -m "durum: reels kaydi [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::durum kaydi push edilemedi"
          exit 1
